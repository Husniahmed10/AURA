# AURA - Project Configuration
aura:
  project_name: "AURA"
  version: "0.1.0"

  # Target defaults
  target:
    max_attacks: 200
    sensitivity: "HIGH"
    timeout_seconds: 300

  # Agent settings
  agents:
    recon:
      num_probes: 30
      probe_timeout: 10
    attack:
      max_concurrent: 5
      retry_attempts: 3
    evaluator:
      cvss_threshold: 4.0
    report:
      format: ["pdf", "json"]

  # LLM routing via Portkey
  llm_routing:
    attack_model: "llama-3.1-70b-versatile"    # Groq - fast + free for attacks
    report_model: "gpt-4o"                      # OpenAI - best for report writing
    eval_model: "llama-3.1-70b-versatile"       # Groq - good for evaluation
    recon_model: "llama-3.1-8b-instant"         # Groq - fast + cheap for probing

  # Pinecone settings
  pinecone:
    index_name: "aura-attacks"
    namespace: "attack_strategies"
    top_k: 5

  # Redis settings
  redis:
    scan_ttl: 86400    # 24 hours
    cache_ttl: 604800  # 7 days
